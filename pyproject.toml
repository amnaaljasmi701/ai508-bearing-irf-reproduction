[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "irf-repro"
version = "1.0.0"
description = "Reproduction of Wan et al. (2021) Spark + Improved Random Forest bearing fault diagnosis"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
